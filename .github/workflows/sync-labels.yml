name: Sync labels

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Only report the label changes, without applying them.'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  sync-labels:
    name: Sync labels
    permissions:
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout shared taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: backend-br/.github
          ref: main
          path: .shared
          sparse-checkout: scripts
          persist-credentials: false

      - name: Create and update the taxonomy labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const root = `${process.env.GITHUB_WORKSPACE}/.shared`
            const { run } = await import(`${root}/scripts/sync-labels.mjs`)
            await run({ github, context, taxonomyFile: `${root}/taxonomy.json`, isDryRun: process.env.DRY_RUN === 'true' })
