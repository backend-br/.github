name: Validate links

on:
  workflow_call:
    inputs:
      build-site:
        description: 'Builds the site with pnpm before checking its links.'
        required: false
        type: boolean
        default: false
      lychee-args:
        description: 'Arguments passed to lychee.'
        required: false
        type: string
        default: "--verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'"

permissions: {}

jobs:
  link-checker:
    name: Link checker
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - if: inputs.build-site
        name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - if: inputs.build-site
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - if: inputs.build-site
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - if: inputs.build-site
        name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - id: lychee
        name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: ${{ inputs.lychee-args }}
          fail: false

      - if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        name: Create issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710
        with:
          title: Relatório de links quebrados
          labels: 'report, automated-issue'
          content-filepath: ./lychee/out.md

      - if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        name: Assign issues
        uses: gustavofreze/auto-assign@2b04688604e1bc6649d9d75c8273b1699c413853
        with:
          assignees: '${{ vars.ASSIGNEES }}'
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          allow_self_assign: 'true'
          allow_no_assignees: 'true'
          assignment_options: 'ISSUE'
